name: quality-gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repository boundary and secret scan
        shell: pwsh
        run: ./infra/scripts/check-repository.ps1

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run web:lint
      - run: npm run web:test
      - run: npm run web:build
      - run: npm run contract:lint
      - name: Install browser for review recovery regression
        run: npx playwright install --with-deps chromium
      - name: Verify approved review recovery in both themes
        run: npm run web:e2e -- review-recovery.spec.ts controlled-accounts.spec.ts resource-config.spec.ts

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: apps/api/pom.xml
      - name: Prepare pinned MinIO image for integration tests
        run: |
          docker pull coollabsio/minio@sha256:a4938f37f1be1841b8e7b627ad0207b265345fd0d063e42d7410c78af0e63e68
          docker tag coollabsio/minio@sha256:a4938f37f1be1841b8e7b627ad0207b265345fd0d063e42d7410c78af0e63e68 minio/minio:RELEASE.2025-04-22T22-12-26Z
      - run: chmod +x mvnw
      - run: ./mvnw -B verify

  compose:
    runs-on: ubuntu-latest
    env:
      VOIDHAVEN_RELEASE_VERSION: 0.1.0-ci
      VOIDHAVEN_GIT_SHA: 0000000000000000000000000000000000000000
      VOIDHAVEN_BUILD_CREATED: 2026-01-01T00:00:00Z
      VOIDHAVEN_API_IMAGE: voidhaven-api:ci
      VOIDHAVEN_WEB_IMAGE: voidhaven-web:ci
      VOIDHAVEN_HTTP_PORT: '18080'
      VOIDHAVEN_PUBLIC_BASE_URL: https://test.example.invalid
      VOIDHAVEN_DB_URL: jdbc:mysql://db.example.invalid:3306/voidhaven
      VOIDHAVEN_DB_USERNAME: ci-user
      VOIDHAVEN_DB_PASSWORD: ci-only-not-a-secret
      VOIDHAVEN_DB_ROOT_PASSWORD: ci-only-not-a-secret
      VOIDHAVEN_RATE_LIMIT_SECRET: ci-only-not-a-secret
      VOIDHAVEN_MEDIA_ENDPOINT: https://media.example.invalid
      VOIDHAVEN_MEDIA_ACCESS_KEY: ci-only
      VOIDHAVEN_MEDIA_SECRET_KEY: ci-only-not-a-secret
      VOIDHAVEN_MEDIA_BUCKET: voidhaven-ci
      VOIDHAVEN_TRUSTED_PROXY_NETWORKS: 172.29.20.0/24
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infra/compose/compose.local.yml config --quiet
      - run: docker compose -f infra/compose/compose.test-server.yml config --quiet
      - run: docker compose -f infra/compose/compose.candidate.yml config --quiet

  full-stack:
    runs-on: ubuntu-latest
    env:
      VOIDHAVEN_E2E_REAL: '1'
      VOIDHAVEN_E2E_BASE_URL: http://127.0.0.1:18080
      VOIDHAVEN_HTTP_PORT: '18080'
      VOIDHAVEN_E2E_ADMIN_LOGIN: local-admin
      VOIDHAVEN_E2E_ADMIN_PASSWORD: change-me-before-first-local-run
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start isolated MySQL, media, API and web
        run: docker compose --project-name voidhavenbaselineci -f infra/compose/compose.local.yml up --build --detach --wait --wait-timeout 180
      - name: Wait for API readiness
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:18080/api/v1/public/capabilities; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Verify real publishing, credentials and controlled entries
        run: npm run web:e2e -- full-stack.spec.ts controlled-accounts.spec.ts
      - name: Preserve synthetic test diagnostics on failure
        if: failure()
        run: docker compose --project-name voidhavenbaselineci -f infra/compose/compose.local.yml logs --tail 120 api
      - name: Stop isolated services
        if: always()
        run: docker compose --project-name voidhavenbaselineci -f infra/compose/compose.local.yml down
