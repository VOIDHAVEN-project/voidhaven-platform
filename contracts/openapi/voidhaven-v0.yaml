      description: PENDING 激活后变为 ACTIVE；ACTIVE 可停用为 SUSPENDED 或撤销为 REVOKED；SUSPENDED 可恢复为 ACTIVE 或撤销为 REVOKED；REVOKED 为永久终态。激活、恢复、停用与撤销并发后最终只能是 REVOKED。
      type: string
      enum: [PENDING, ACTIVE, SUSPENDED, REVOKED]
    ApiError:
      type: object
      required: [code, message, requestId, fieldErrors, retryable]
      properties:
        code: { type: string }
        message: { type: string }
        requestId: { type: string }
        fieldErrors: { type: object, additionalProperties: { type: string } }
        retryable: { type: boolean }
