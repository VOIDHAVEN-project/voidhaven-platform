server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_types text/plain text/css application/json application/javascript text/javascript application/xml image/svg+xml;

  # Vite content-hashes every filename under /assets/, so these are safe to cache forever;
  # a new deploy ships new filenames rather than mutating an old one.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # index.html references the current hashed asset filenames, so it must always be
  # revalidated -- caching it would pin users to a stale build's asset references.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}