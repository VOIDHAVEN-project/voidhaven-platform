openapi: 3.1.0
info:
  title: VOIDHAVEN V0 API
  version: 0.1.0
  description: 公开读取、公开输入和受控后台的接口契约。所有写入接口均使用 Idempotency-Key；私密字段绝不出现在公开响应。
servers: [{ url: /api/v1 }]
paths:
  /public/capabilities:
    get:
      summary: 读取当前可供公开页面使用的产品能力；用于安全关闭未配置功能
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductCapabilitiesEnvelope' }
  /public/home:
    get:
      summary: 首页三栏投影
      responses: { '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/HomeEnvelope' } } } } }
  /public/sitemap.xml:
    get:
      summary: 公开内容站点地图；只包含当前公开且来源合规的稳定详情 URL
      responses:
        '200':
          description: XML sitemap
          content: { application/xml: { schema: { type: string } } }
  /public/content-modules:
    get:
      summary: 当前公开内容模块定义、显示名称与可筛选字段
      responses:
        {
          '200':
            { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/ContentModuleSetEnvelope' } } } },
        }
  /public/content:
    get:
      summary: 按可演进模块键读取公开内容；模块键由内容模块定义提供
      parameters:
        [
          { name: module, in: query, required: true, schema: { type: string, maxLength: 64 } },
          { name: filterKey, in: query, required: false, schema: { type: string, maxLength: 64 } },
          { name: filterValue, in: query, required: false, schema: { type: string, maxLength: 512 } },
          { $ref: '#/components/parameters/PageSize' },
          { $ref: '#/components/parameters/CsCursor' },
          { $ref: '#/components/parameters/SearchQuery' },
        ]
      responses:
        {
          '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/PublicPageEnvelope' } } } },
          '400': { description: 模块不存在或已停用 },
        }
  /public/content/{id}:
    get:
      summary: 按稳定不透明 ID 读取公开详情；不依赖内容模块或标题
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        {
          '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/PublicContentEnvelope' } } } },
          '404': { $ref: '#/components/responses/HiddenNotFound' },
        }
  /public/content/{id}/related:
    get:
      summary: 读取显式关联的公开内容；比赛详情可据此反向展示招募
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/PublicPageEnvelope' } } } }
        '404': { $ref: '#/components/responses/HiddenNotFound' }
  /public/content/{id}/gated-actions:
    get:
      summary: 使用短期社群授权读取招募的受控行动入口
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/CommunityGrant' }
      responses:
        '200': { description: 成功 }
        '401': { description: 社群授权无效或已过期 }
        '404': { $ref: '#/components/responses/HiddenNotFound' }
  /public/competitions:
    get:
      summary: 公开竞赛列表（服务端筛选与 Cursor 分页）
      parameters:
        [
          { $ref: '#/components/parameters/PageSize' },
          { $ref: '#/components/parameters/CsCursor' },
          { $ref: '#/components/parameters/SearchQuery' },
        ]
      responses:
        { '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/PublicPageEnvelope' } } } } }
  /public/competitions/{id}:
    get:
      summary: 公开竞赛详情
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: 成功 }, '404': { $ref: '#/components/responses/HiddenNotFound' } }
  /public/resources:
    get:
      summary: 公开学习资源列表（服务端筛选与 Cursor 分页）
      parameters:
        [
          { $ref: '#/components/parameters/PageSize' },
          { $ref: '#/components/parameters/CsCursor' },
          { $ref: '#/components/parameters/SearchQuery' },
        ]
      responses:
        { '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/PublicPageEnvelope' } } } } }
  /public/resources/{id}:
    get:
      {
        summary: 公开学习资源详情,
        parameters: [{ $ref: '#/components/parameters/Id' }],
        responses: { '200': { description: 成功 }, '404': { $ref: '#/components/responses/HiddenNotFound' } },
      }
  /public/recruitments:
    get:
      summary: 公开团队招募列表（服务端筛选与 Cursor 分页）
      parameters:
        [
          { $ref: '#/components/parameters/PageSize' },
          { $ref: '#/components/parameters/CsCursor' },
          { $ref: '#/components/parameters/SearchQuery' },
        ]
      responses:
        { '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/PublicPageEnvelope' } } } } }
  /public/recruitments/{id}:
    get:
      {
        summary: 公开团队招募详情,
        parameters: [{ $ref: '#/components/parameters/Id' }],
        responses: { '200': { description: 成功 }, '404': { $ref: '#/components/responses/HiddenNotFound' } },
      }
  /public/media/{id}:
    get:
      summary: 仅当媒体仍关联于公开、活跃内容时读取处理后的图片；响应不缓存
      parameters: [{ $ref: '#/components/parameters/MediaId' }]
      responses:
        '200': { description: 处理后的 JPEG 或 PNG 图片，Cache-Control 为 no-store, content: { image/jpeg: {}, image/png: {} } }
        '404': { $ref: '#/components/responses/HiddenNotFound' }
  /public/submissions:
    post:
      summary: 公开投稿、反馈或版权投诉；回执号与查询码仅本次返回
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SubmissionRequest' } } } }
      responses:
        '201': { description: 已接收, content: { application/json: { schema: { $ref: '#/components/schemas/CreatedCaseEnvelope' } } } }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '503': { description: 必填联系人功能未安全配置 }
  /public/submissions/status-query:
    post:
      summary: 使用回执号与查询码查询处理状态；失败响应不区分回执是否存在
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CaseQueryRequest' } } } }
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/CaseStatusEnvelope' } } } }
        '404': { description: 查询凭据无效 }
  /public/partner-applications:
    post:
      summary: 公开合作方申请；联系人必填，回执号与查询码仅本次返回
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PartnerApplicationRequest' } } } }
      responses:
        '201': { description: 已接收, content: { application/json: { schema: { $ref: '#/components/schemas/CreatedCaseEnvelope' } } } }
        '503': { description: 联系人功能未安全配置 }
  /public/partner-applications/status-query:
    post:
      summary: 使用回执号与查询码查询合作申请状态
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CaseQueryRequest' } } } }
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/CaseStatusEnvelope' } } } }
        '404': { description: 查询凭据无效 }
  /public/community-gate/verify:
    post:
      summary: 使用批次共享邀请码换取 30 分钟短期授权
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CommunityVerifyRequest' } } } }
      responses:
        '200': { description: 验证成功, content: { application/json: { schema: { $ref: '#/components/schemas/CommunityGrantEnvelope' } } } }
        '401': { description: 邀请码无效、过期、已撤销或已用尽 }
        '429': { description: 尝试次数过多 }
        '503': { description: 社群入口未启用 }
  /public/community/entries:
    get:
      summary: 无授权时读取公开社群入口；携带短期授权时同时读取受控入口
      parameters: [{ $ref: '#/components/parameters/CommunityGrantOptional' }]
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/CommunityEntryListEnvelope' } } } }
        '401': { description: 社群授权无效或已过期 }
  /public/community/media/{id}:
    get:
      summary: 使用短期授权读取社群或招聘受控二维码；响应禁止缓存
      parameters: [{ $ref: '#/components/parameters/MediaId' }, { $ref: '#/components/parameters/CommunityGrant' }]
      responses:
        '200': { description: '图片字节，Cache-Control: no-store' }
        '401': { description: 社群授权无效或已过期 }
  /auth/session:
    post: { summary: 受控账号登录, responses: { '200': { description: 会话已创建 }, '401': { description: 通用认证失败 } } }
    delete: { summary: 销毁当前会话, responses: { '204': { description: 已退出 } } }
  /auth/me:
    get: { summary: 当前受控身份, responses: { '200': { description: 成功 }, '401': { description: 未认证 } } }
  /auth/csrf:
    get: { summary: 获取受控写操作的 CSRF 令牌, responses: { '200': { description: 成功 } } }
  /auth/activation/consume:
    post:
      summary: 使用一次性激活令牌设置首个密码
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ActivationRequest' } } } }
      responses: { '200': { description: 已激活 }, '400': { description: 令牌无效、已使用或已过期 } }
  /auth/password/change:
    post:
      summary: 已登录账号验证当前密码后修改密码，并注销该账号全部会话
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordChangeRequest' } } } }
      responses:
        { '204': { description: 已修改，需重新登录 }, '400': { description: 当前密码错误或新密码不合规 }, '401': { description: 未登录 } }
  /auth/password-reset/consume:
    post:
      summary: 使用超级管理员人工交付的一次性凭据设置新密码
      requestBody:
        { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordResetConsumeRequest' } } } }
      responses: { '200': { description: 已重置 }, '400': { description: 凭据无效、已使用或已过期 } }
  /content-modules:
    get:
      summary: 受控编辑器使用的当前内容模块定义
      responses: { '200': { description: 成功 }, '401': { description: 未认证 }, '403': { description: 不是合作方或管理员 } }
  /media/uploads:
    post:
      summary: 合作方或管理员向自己的可编辑候选修订上传一张正文图片
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [contentItemId, altText, file]
              properties:
                contentItemId: { type: string, minLength: 26, maxLength: 26 }
                altText: { type: string, minLength: 1, maxLength: 240 }
                file: { type: string, format: binary, description: 实际文件类型必须为 JPEG、PNG 或 WebP；服务端重编码后仅保存 JPEG/PNG。 }
      responses:
        '200':
          {
            description: 图片已安全处理并关联候选修订,
            content: { application/json: { schema: { $ref: '#/components/schemas/MediaEnvelope' } } },
          }
        '400': { description: 类型、尺寸、大小或图片说明不合规 }
        '403': { description: 未认证或不具备合作方/管理员资格 }
        '404': { $ref: '#/components/responses/HiddenNotFound' }
        '409': { description: 候选状态、图片数量/总量或幂等键冲突 }
  /media/action-uploads:
    post:
      summary: 合作方或管理员为团队招募入口上传专用二维码；不关联正文附件
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [contentItemId, altText, file]
              properties:
                contentItemId: { type: string, minLength: 26, maxLength: 26 }
                altText: { type: string, minLength: 1, maxLength: 240 }
                file: { type: string, format: binary }
      responses:
        '200':
          {
            description: 已创建 24 小时入口图片暂存记录,
            content: { application/json: { schema: { $ref: '#/components/schemas/MediaEnvelope' } } },
          }
        '400': { description: 图片不合规 }
        '403': { description: 无权编辑该内容 }
        '404': { $ref: '#/components/responses/HiddenNotFound' }
        '409': { description: 幂等键冲突 }
  /media/{id}/preview:
    get:
      summary: 管理员读取待审媒体，或合作方读取自己候选修订的媒体；匿名和跨归属统一 404
      parameters: [{ $ref: '#/components/parameters/MediaId' }]
      responses:
        '200': { description: 受控预览图片，Cache-Control 为 no-store, content: { image/jpeg: {}, image/png: {} } }
        '404': { $ref: '#/components/responses/HiddenNotFound' }
  /partner/dashboard:
    get:
      {
        summary: 合作方自己的配额和分页内容工作台,
        parameters:
          [
            { $ref: '#/components/parameters/ManagementCursor' },
            { $ref: '#/components/parameters/PageSize' },
            { $ref: '#/components/parameters/SearchQuery' },
            { $ref: '#/components/parameters/StatusFilter' },
            { $ref: '#/components/parameters/ModuleFilter' },
          ],
        responses: { '200': { description: 成功 }, '403': { description: 无有效合作方档案 } },
      }
  /partner/content-items:
    get:
      {
        summary: 合作方自己的分页内容,
        parameters:
          [
            { $ref: '#/components/parameters/ManagementCursor' },
            { $ref: '#/components/parameters/PageSize' },
            { $ref: '#/components/parameters/SearchQuery' },
            { $ref: '#/components/parameters/StatusFilter' },
            { $ref: '#/components/parameters/ModuleFilter' },
          ],
        responses: { '200': { description: 成功 }, '403': { description: 权限不足 } },
      }
    post:
      { summary: 创建草稿, parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }], responses: { '201': { description: 已创建 } } }
  /partner/content-items/{id}:
    get:
      summary: 合作方读取自己的可编辑候选修订及已关联媒体
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        {
          '200':
            {
              description: 可编辑草稿,
              content: { application/json: { schema: { $ref: '#/components/schemas/EditableContentEnvelope' } } },
            },
          '404': { $ref: '#/components/responses/HiddenNotFound' },
        }
    patch:
      summary: 合作方创建候选修订
      parameters:
        [
          { $ref: '#/components/parameters/Id' },
          { $ref: '#/components/parameters/IdempotencyKey' },
          { $ref: '#/components/parameters/IfMatch' },
        ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ContentDraft' } } } }
      responses:
        {
          '200': { description: 已创建候选修订 },
          '404': { $ref: '#/components/responses/HiddenNotFound' },
          '409': { description: 版本或状态冲突 },
        }
  /partner/content-items/{id}/submit-review:
    post:
      {
        summary: 合作方送审自己的草稿,
        parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }],
        responses: { '200': { description: 已送审 }, '404': { $ref: '#/components/responses/HiddenNotFound' } },
      }
  /partner/content-items/{id}/actions:
    get:
      summary: 合作方读取自己的团队招募候选入口
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/ManagedActionListEnvelope' } } } }
        '404': { $ref: '#/components/responses/HiddenNotFound' }
    put:
      summary: 保存团队招募入口；已发布内容自动生成待审核候选修订
      parameters:
        [
          { $ref: '#/components/parameters/Id' },
          { $ref: '#/components/parameters/IdempotencyKey' },
          { $ref: '#/components/parameters/IfMatch' },
        ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ContentActionSetRequest' } } } }
      responses:
        '200': { description: 已保存, content: { application/json: { schema: { $ref: '#/components/schemas/ContentActionSetEnvelope' } } } }
        '404': { $ref: '#/components/responses/HiddenNotFound' }
        '409': { description: 版本、工作流状态或幂等键冲突 }
  /admin/review-queue:
    get:
      {
        summary: 管理员分页审核队列,
        parameters:
          [
            { $ref: '#/components/parameters/ManagementCursor' },
            { $ref: '#/components/parameters/PageSize' },
            { $ref: '#/components/parameters/SearchQuery' },
            { $ref: '#/components/parameters/ModuleFilter' },
          ],
        responses:
          {
            '200':
              { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/ManagedContentPageEnvelope' } } } },
            '403': { description: 权限不足 },
          },
      }
  /admin/content-items:
    get:
      {
        summary: 管理员分页内容列表,
        parameters:
          [
            { $ref: '#/components/parameters/ManagementCursor' },
            { $ref: '#/components/parameters/PageSize' },
            { $ref: '#/components/parameters/SearchQuery' },
            { $ref: '#/components/parameters/StatusFilter' },
            { $ref: '#/components/parameters/ModuleFilter' },
            { $ref: '#/components/parameters/VerificationFilter' },
          ],
        responses:
          {
            '200':
              { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/ManagedContentPageEnvelope' } } } },
          },
      }
    post:
      summary: 管理员创建或代录草稿
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ContentDraft' } } } }
      responses: { '200': { description: 已创建 } }
  /admin/content-items/{id}:
    get:
      summary: 管理员读取一个可编辑候选修订
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        {
          '200':
            {
              description: 可编辑草稿,
              content: { application/json: { schema: { $ref: '#/components/schemas/EditableContentEnvelope' } } },
            },
          '404': { $ref: '#/components/responses/HiddenNotFound' },
        }
    patch:
      summary: 管理员创建候选修订
      parameters:
        [
          { $ref: '#/components/parameters/Id' },
          { $ref: '#/components/parameters/IdempotencyKey' },
          { $ref: '#/components/parameters/IfMatch' },
        ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ContentDraft' } } } }
      responses: { '200': { description: 已创建候选修订 }, '409': { description: 版本冲突 } }
  /admin/content-items/{id}/submit-review:
    post:
      {
        summary: 管理员送审草稿,
        parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }],
        responses: { '200': { description: 已送审 } },
      }
  /admin/content-items/{id}/verifications:
    get:
      summary: 管理员读取最近 20 条来源与链接核验记录
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: 成功 }, '403': { description: 不是管理员 } }
    post:
      summary: 管理员登记有效、失效或待复核结果，并更新异常及到期待办
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ContentVerificationRequest' } } } }
      responses: { '200': { description: 已登记 }, '400': { description: 核验结果或说明无效 }, '403': { description: 不是管理员 } }
  /admin/content-items/{id}/actions:
    get:
      summary: 管理员读取团队招募候选入口
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/ManagedActionListEnvelope' } } } }
    put:
      summary: 保存团队招募入口；已发布内容自动生成待审核候选修订
      parameters:
        [
          { $ref: '#/components/parameters/Id' },
          { $ref: '#/components/parameters/IdempotencyKey' },
          { $ref: '#/components/parameters/IfMatch' },
        ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ContentActionSetRequest' } } } }
      responses:
        '200': { description: 已保存, content: { application/json: { schema: { $ref: '#/components/schemas/ContentActionSetEnvelope' } } } }
        '409': { description: 版本、工作流状态或幂等键冲突 }
  /admin/reviews/{id}/decision:
    post:
      summary: 管理员审核通过、退回或拒绝
      parameters:
        [
          { $ref: '#/components/parameters/Id' },
          { $ref: '#/components/parameters/IdempotencyKey' },
          { $ref: '#/components/parameters/IfMatch' },
        ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewDecision' } } } }
      responses: { '200': { description: 已记录审核决定 } }
  /admin/content-items/{id}/publication-readiness:
    get:
      summary: 发布前检查状态、媒体、来源和合作方活跃配额
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        {
          '200':
            {
              description: 就绪状态与稳定阻断码,
              content: { application/json: { schema: { $ref: '#/components/schemas/PublicationReadinessEnvelope' } } },
            },
        }
  /admin/content-items/{id}/reopen:
    post:
      summary: 超级管理员将已拒绝稿件重开为待修改
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ActionReason' } } } }
      responses: { '200': { description: 已重开 }, '403': { description: 仅超级管理员 }, '409': { description: 当前状态不可重开 } }
  /admin/content-items/{id}/publish:
    post:
      {
        summary: 发布已通过内容,
        parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }],
        responses: { '200': { description: 已发布 }, '409': { description: 状态或配额冲突 } },
      }
  /admin/content-items/{id}/hide:
    post:
      {
        summary: 隐藏内容,
        parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }],
        responses: { '200': { description: 已隐藏 } },
      }
  /admin/content-items/{id}/show:
    post:
      {
        summary: 重新公开已隐藏的已发布内容,
        parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }],
        responses: { '200': { description: 已重新公开 } },
      }
  /admin/content-items/{id}/archive:
    post:
      {
        summary: 归档内容,
        parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }],
        responses: { '200': { description: 已归档 } },
      }
  /admin/content-items/{id}/restore:
    post:
      {
        summary: 恢复归档内容为隐藏状态,
        parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }],
        responses: { '200': { description: 已恢复 } },
      }
  /admin/content-items/{id}/operational-status:
    post:
      summary: 管理员变更招募业务状态；紧急暂停可立即隐藏行动入口
      parameters:
        [
          { $ref: '#/components/parameters/Id' },
          { $ref: '#/components/parameters/IdempotencyKey' },
          { $ref: '#/components/parameters/IfMatch' },
        ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OperationalStatusChange' } } } }
      responses: { '200': { description: 已更新 }, '409': { description: 版本或状态冲突 } }
  /admin/partner-applications:
    get:
      {
        summary: 分页查询合作方申请，默认仅待处理且不返回私密联系方式,
        parameters:
          [
            { $ref: '#/components/parameters/ManagementCursor' },
            { $ref: '#/components/parameters/PageSize' },
            { $ref: '#/components/parameters/SearchQuery' },
            { name: status, in: query, schema: { $ref: '#/components/schemas/PartnerApplicationStatusFilter' } },
          ],
        responses: { '200': { description: 成功 } },
      }
  /admin/partner-applications/{id}/approve:
    post:
      summary: 兼容期快捷路径：批准申请并签发激活凭据，写入 from_state 与人工交付记录
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ApprovePartnerApplication' } } } }
      responses: { '200': { description: 凭据仅在此首次响应中出现 }, '409': { description: 申请已处理或凭据不可重放 } }
  /admin/partner-applications/{id}/decision:
    post:
      deprecated: true
      summary: 兼容期快捷路径：仅拒绝合作方申请；下一 major 并入 transition
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PartnerApplicationDecision' } } } }
      responses: { '200': { description: 审核状态已更新 }, '409': { description: 申请已处理 } }
  /admin/partner-applications/{id}/transition:
    post:
      summary: 通用状态机；待审状态请用 approve/decision，历史记录必须写入真实 from_state
      parameters:
        [
          { $ref: '#/components/parameters/Id' },
          { $ref: '#/components/parameters/IdempotencyKey' },
          { $ref: '#/components/parameters/IfMatch' },
        ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PublicCaseTransition' } } } }
      responses: { '200': { description: 已更新 }, '409': { description: 版本或状态冲突 } }
  /admin/partner-applications/{id}/contact:
    post:
      summary: 单独授权查看合作申请联系人并记录审计
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ActionReason' } } } }
      responses: { '200': { description: 本次返回解密联系人 }, '404': { description: 申请或联系人不存在 } }
  /admin/submissions:
    get:
      {
        summary: 分页查询公开投稿、反馈和版权请求，默认仅待处理且不返回私密联系方式,
        parameters:
          [
            { $ref: '#/components/parameters/ManagementCursor' },
            { $ref: '#/components/parameters/PageSize' },
            { $ref: '#/components/parameters/SearchQuery' },
            { name: status, in: query, schema: { $ref: '#/components/schemas/PublicSubmissionStatusFilter' } },
          ],
        responses: { '200': { description: 成功 } },
      }
  /admin/submissions/{id}/decision:
    post:
      summary: 审核公开投稿、反馈或版权请求
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PublicInputDecision' } } } }
      responses: { '200': { description: 审核状态已更新 }, '409': { description: 请求已处理 } }
  /admin/submissions/{id}/transition:
    post:
      summary: 更新投稿、反馈或版权请求状态与用户可见答复
      parameters:
        [
          { $ref: '#/components/parameters/Id' },
          { $ref: '#/components/parameters/IdempotencyKey' },
          { $ref: '#/components/parameters/IfMatch' },
        ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PublicCaseTransition' } } } }
      responses: { '200': { description: 已更新 }, '409': { description: 版本或状态冲突 } }
  /admin/submissions/{id}/contact:
    post:
      summary: 单独授权查看提交人联系人并记录审计
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ActionReason' } } } }
      responses: { '200': { description: 本次返回解密联系人 }, '404': { description: 请求或联系人不存在 } }
  /admin/partner-profiles:
    get:
      {
        summary: 分页合作方档案、账号资格与当前配额,
        parameters:
          [
            { $ref: '#/components/parameters/ManagementCursor' },
            { $ref: '#/components/parameters/PageSize' },
            { $ref: '#/components/parameters/SearchQuery' },
          ],
        responses: { '200': { description: 成功 } },
      }
  /admin/partner-profiles/{id}/content-quota:
    patch:
      summary: 设置 0–5 条公开活跃内容配额
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/QuotaChange' } } } }
      responses: { '200': { description: 配额已更新 } }
  /admin/content-ownership-transfers:
    post:
      summary: 管理员转交内容归属
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OwnershipTransfer' } } } }
      responses: { '200': { description: 已转交 } }
  /admin/accounts:
    get:
      {
        summary: 超级管理员分页查询受控账号,
        parameters:
          [
            { $ref: '#/components/parameters/ManagementCursor' },
            { $ref: '#/components/parameters/PageSize' },
            { $ref: '#/components/parameters/SearchQuery' },
            { name: status, in: query, schema: { type: string, enum: [PENDING, ACTIVE, SUSPENDED, REVOKED] } },
          ],
        responses: { '200': { description: 成功 }, '401': { description: 未登录 }, '403': { description: 仅超级管理员 } },
      }
    post:
      {
        summary: 超级管理员创建仅含 ADMIN 角色的待激活账号，激活令牌仅本次返回且不可重放,
        parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }],
        requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateAdminAccount' } } } },
        responses:
          {
            '200': { description: 已创建 PENDING 账号；activationToken 仅本次返回 },
            '401': { description: ACCOUNT_INACTIVE 或未登录 },
            '403': { description: 仅超级管理员 },
            '409': { description: LOGIN_ID_ALREADY_EXISTS、REQUEST_IN_PROGRESS 或 SENSITIVE_RESULT_NOT_REPLAYABLE },
          },
      }
  /admin/accounts/{id}/activation-links:
    post:
      {
        summary: 为 PENDING 账号重新签发一次性激活链接，并使此前未使用令牌失效,
        parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }],
        requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ActionReason' } } } },
        responses:
          {
            '200': { description: 已重签；activationToken 仅本次返回 },
            '401': { description: ACCOUNT_INACTIVE },
            '403': { description: 仅超级管理员 },
            '409': { description: 账号非 PENDING、REQUEST_IN_PROGRESS 或 SENSITIVE_RESULT_NOT_REPLAYABLE },
          },
      }
  /admin/accounts/{id}/password-reset-links:
    post:
      summary: 超级管理员签发 30 分钟一次性密码重置凭据，明文仅本次返回
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ActionReason' } } } }
      responses: { '200': { description: 已签发 }, '403': { description: 仅超级管理员 }, '409': { description: 敏感结果不可重放 } }
  /admin/accounts/{id}/suspend:
    post:
      {
        summary: 超级管理员停用账号；其下一次受限请求立即失效,
        parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }],
        requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ActionReason' } } } },
        responses:
          {
            '200': { description: 已停用 },
            '401': { description: ACCOUNT_INACTIVE },
            '403': { description: 仅超级管理员 },
            '409': { description: ACCOUNT_VERSION_CONFLICT 或状态不允许停用 },
          },
      }
  /admin/accounts/{id}/reactivate:
    post:
      {
        summary: 超级管理员恢复已停用账号,
        parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }],
        requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ActionReason' } } } },
        responses:
          {
            '200': { description: 已恢复 },
            '401': { description: ACCOUNT_INACTIVE },
            '409': { description: 已撤销账号不可恢复或 ACCOUNT_VERSION_CONFLICT },
          },
      }
  /admin/accounts/{id}/revoke:
    post:
      {
        summary: 超级管理员永久撤销账号,
        parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }],
        requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ActionReason' } } } },
        responses:
          {
            '200': { description: 已撤销 },
            '401': { description: ACCOUNT_INACTIVE },
            '409': { description: 撤销不可恢复或 ACCOUNT_VERSION_CONFLICT },
          },
      }
  /admin/tasks:
    get:
      summary: 管理后台待办计数与可操作深链
      responses: { '200': { description: 成功 } }
  /admin/manual-deliveries:
    get:
      summary: 超级管理员按对象读取人工交付留痕
      parameters:
        - { name: subjectType, in: query, schema: { type: string, enum: [ACCOUNT, PARTNER_APPLICATION, SUBMISSION] } }
        - { name: subjectId, in: query, schema: { type: string, minLength: 26, maxLength: 26 } }
      responses: { '200': { description: 成功 }, '403': { description: 仅超级管理员 } }
    post:
      summary: 超级管理员在实际完成交付后确认一次人工交付；签发凭据本身不计为交付
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subjectType, subjectId, deliveryType]
              properties:
                subjectType: { type: string, enum: [ACCOUNT, PARTNER_APPLICATION, SUBMISSION] }
                subjectId: { type: string, minLength: 26, maxLength: 26 }
                deliveryType: { type: string, enum: [ACTIVATION, PASSWORD_RESET, STATUS_RESULT] }
                note: { type: string, maxLength: 1000 }
      responses: { '200': { description: 已记录 }, '403': { description: 仅超级管理员 } }
  /admin/community/media:
    post:
      summary: 超级管理员上传社群二维码图片；返回媒体 ID 供创建入口使用
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, altText]
              properties:
                file: { type: string, format: binary }
                altText: { type: string, maxLength: 240 }
      responses: { '200': { description: 已上传 }, '403': { description: 仅超级管理员 } }
  /admin/community/entries:
    get: { summary: 超级管理员读取社群入口, responses: { '200': { description: 成功 }, '403': { description: 仅超级管理员 } } }
    post:
      summary: 超级管理员创建社群入口
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CommunityEntryWrite' } } } }
      responses:
        { '201': { description: 已创建 }, '400': { description: 模型组合、格式或公开风险确认无效 }, '403': { description: 仅超级管理员 } }
  /admin/community/entries/{id}:
    patch:
      summary: 超级管理员编辑社群入口；事务内切换主入口并使用 If-Match 版本
      parameters:
        [
          { $ref: '#/components/parameters/Id' },
          { $ref: '#/components/parameters/IdempotencyKey' },
          { $ref: '#/components/parameters/IfMatch' },
        ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CommunityEntryWrite' } } } }
      responses: { '200': { description: 已更新 }, '403': { description: 仅超级管理员 }, '409': { description: 版本冲突或入口已停用 } }
  /admin/community/entries/{id}/deactivate:
    post:
      summary: 超级管理员停用社群入口并清除主入口标记
      parameters:
        [
          { $ref: '#/components/parameters/Id' },
          { $ref: '#/components/parameters/IdempotencyKey' },
          { $ref: '#/components/parameters/IfMatch' },
        ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ActionReason' } } } }
      responses: { '200': { description: 已停用 }, '403': { description: 仅超级管理员 }, '409': { description: 版本冲突 } }
  /admin/community/invite-batches:
    get: { summary: 超级管理员读取邀请码批次统计, responses: { '200': { description: 成功 }, '403': { description: 仅超级管理员 } } }
    post:
      summary: 超级管理员创建邀请码批次；明文邀请码仅本次返回
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateInviteBatch' } } } }
      responses: { '201': { description: 已创建 }, '403': { description: 仅超级管理员 }, '409': { description: 敏感结果不可重放 } }
  /admin/community/invite-batches/{id}/revoke:
    post:
      summary: 超级管理员立即撤销邀请码批次
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ActionReason' } } } }
      responses: { '200': { description: 已撤销 }, '403': { description: 仅超级管理员 } }
  /admin/homepage-placements:
    get:
      summary: 管理员读取首页编排
      responses:
        '200':
          description: 成功
          content: { application/json: { schema: { $ref: '#/components/schemas/HomepagePlacementReplacement' } } }
    put:
      summary: 管理员整体替换首页编排；同一栏目下同一内容复用原记录，避免与历史停用行冲突
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/HomepagePlacementWrite' } } } }
      responses:
        '200':
          description: 已保存，响应可幂等回放
          content: { application/json: { schema: { $ref: '#/components/schemas/HomepagePlacementReplacement' } } }
  /admin/audit-logs:
    get:
      {
        summary: 按操作人、对象、动作和时间分页查询最小审计摘要,
        parameters:
          [
            { $ref: '#/components/parameters/ManagementCursor' },
            { $ref: '#/components/parameters/PageSize' },
            { $ref: '#/components/parameters/SearchQuery' },
            { name: action, in: query, schema: { type: string, maxLength: 100 } },
            { name: actorAccountId, in: query, schema: { type: string, minLength: 26, maxLength: 26 } },
            { name: objectType, in: query, schema: { type: string, maxLength: 64 } },
            { name: from, in: query, schema: { type: string, format: date-time } },
            { name: to, in: query, schema: { type: string, format: date-time } },
          ],
        responses: { '200': { description: 成功，不含密码、令牌、私密正文或联系方式 }, '400': { description: 时间范围无效 } },
      }
components:
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, minLength: 26, maxLength: 26 } }
    MediaId: { name: id, in: path, required: true, schema: { type: string, minLength: 26, maxLength: 26 } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 128 } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string, description: JPA 内容版本号 } }
    CommunityGrant:
      {
        name: X-Community-Grant,
        in: header,
        required: true,
        schema: { type: string, minLength: 32, maxLength: 256 },
        description: 仅保存在当前页面内存中的短期授权,
      }
    CommunityGrantOptional:
      {
        name: X-Community-Grant,
        in: header,
        required: false,
        schema: { type: string, minLength: 32, maxLength: 256 },
        description: 可选的短期授权；不携带时响应只包含 PUBLIC 入口,
      }
    PageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
    CsCursor: { name: cursor, in: query, schema: { type: string, description: 上一页最后一条不透明 ID } }
    SearchQuery: { name: q, in: query, schema: { type: string, maxLength: 240 } }
    ManagementCursor:
      { name: cursor, in: query, schema: { type: string, minLength: 26, maxLength: 26, description: 上一页最后一条管理记录的不透明 ID } }
    StatusFilter:
      { name: status, in: query, schema: { type: string, enum: [DRAFT, PENDING_REVIEW, APPROVED, CHANGES_REQUESTED, REJECTED, PUBLISHED] } }
    ModuleFilter: { name: module, in: query, schema: { type: string, maxLength: 64 } }
    VerificationFilter: { name: verification, in: query, schema: { type: string, enum: [attention, due] } }
  responses:
    HiddenNotFound: { description: 不存在、隐藏、待审或无权限时统一返回 404 }
    IdempotencyConflict: { description: 相同幂等键用于不同请求 }
  schemas:
    ProductCapabilitiesEnvelope:
      type: object
      required: [data, requestId]
      properties:
        requestId: { type: string }
        data:
          type: object
          required: [privateContactEnabled, communityGateEnabled, gatedRecruitmentEnabled, statusQueryEnabled]
          properties:
            privateContactEnabled:
              type: boolean
              description: 是否可安全收集和读取私密联系方式
            communityGateEnabled:
              type: boolean
              description: 邀请码、短期授权及社群入口是否已完整配置
            gatedRecruitmentEnabled:
              type: boolean
              description: 受控招募联系方式和二维码是否可用
            statusQueryEnabled:
              type: boolean
