spring:
  application:
    name: voidhaven-api
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${VOIDHAVEN_DB_URL:jdbc:mysql://localhost:3306/voidhaven?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${VOIDHAVEN_DB_USERNAME:voidhaven_app}
    password: ${VOIDHAVEN_DB_PASSWORD:change-me-local-only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  session:
    # Persist sessions in MySQL so a restart/redeploy or additional API replica
    # can share login state. Horizontal scale still requires a non-mixed cutover
    # (see docs/runbooks/release-and-rollback.md).
    store-type: jdbc
    timeout: 8h
    jdbc:
      initialize-schema: never
  jackson:
    default-property-inclusion: non_null
server:
  port: ${SERVER_PORT:8081}
  servlet:
    session:
      cookie:
        name: VOIDHAVEN_SESSION
        http-only: true
        secure: ${VOIDHAVEN_COOKIE_SECURE:false}
        same-site: strict
      timeout: 8h
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      # Docker Compose is not auto-detected as a Kubernetes environment, so the
      # liveness/readiness health groups are not registered unless explicitly enabled here.
      # compose.candidate.yml's healthcheck depends on /actuator/health/readiness existing.
      probes:
        enabled: true
      group:
        readiness:
          # The default readiness group only includes readinessState; without "db" it never
          # reflects a real database outage, so it would always report UP.
          include: readinessState,db
voidhaven:
  cookie-secure: ${VOIDHAVEN_COOKIE_SECURE:false}
  public-base-url: ${VOIDHAVEN_PUBLIC_BASE_URL:http://localhost:8080}
  local-fixture-sources-enabled: ${VOIDHAVEN_LOCAL_FIXTURE_SOURCES_ENABLED:false}
  bootstrap-admin-login: ${VOIDHAVEN_BOOTSTRAP_ADMIN_LOGIN:}
  bootstrap-admin-password: ${VOIDHAVEN_BOOTSTRAP_ADMIN_PASSWORD:}
  bootstrap-partner-login: ${VOIDHAVEN_BOOTSTRAP_PARTNER_LOGIN:}
  bootstrap-partner-password: ${VOIDHAVEN_BOOTSTRAP_PARTNER_PASSWORD:}
  community-gate-enabled: ${VOIDHAVEN_COMMUNITY_GATE_ENABLED:false}
  community-grant-minutes: ${VOIDHAVEN_COMMUNITY_GRANT_MINUTES:30}
  community-invite-hmac-secret: ${VOIDHAVEN_COMMUNITY_INVITE_HMAC_SECRET:local-development-community-secret}
  private-contact-enabled: ${VOIDHAVEN_PRIVATE_CONTACT_ENABLED:false}
  private-value-current-key-id: ${VOIDHAVEN_PRIVATE_VALUE_CURRENT_KEY_ID:}
  private-value-keys: ${VOIDHAVEN_PRIVATE_VALUE_KEYS:}
  public-write-rate-limit-secret: ${VOIDHAVEN_RATE_LIMIT_SECRET:local-development-rate-limit-secret}
  public-write-rate-limit-max-requests: ${VOIDHAVEN_PUBLIC_WRITE_RATE_LIMIT:8}
  public-write-rate-limit-window-seconds: ${VOIDHAVEN_PUBLIC_WRITE_RATE_LIMIT_WINDOW_SECONDS:3600}
  public-status-query-rate-limit-max-requests: ${VOIDHAVEN_PUBLIC_STATUS_QUERY_RATE_LIMIT:60}
  public-status-query-rate-limit-window-seconds: ${VOIDHAVEN_PUBLIC_STATUS_QUERY_RATE_LIMIT_WINDOW_SECONDS:3600}
  auth-login-failure-limit: ${VOIDHAVEN_AUTH_LOGIN_FAILURE_LIMIT:5}
  auth-login-network-limit: ${VOIDHAVEN_AUTH_LOGIN_NETWORK_LIMIT:20}
  auth-activation-network-limit: ${VOIDHAVEN_AUTH_ACTIVATION_NETWORK_LIMIT:10}
  auth-rate-limit-window-minutes: ${VOIDHAVEN_AUTH_RATE_LIMIT_WINDOW_MINUTES:15}
  idempotency-in-progress-seconds: ${VOIDHAVEN_IDEMPOTENCY_IN_PROGRESS_SECONDS:86400}
  trust-proxy-headers: ${VOIDHAVEN_TRUST_PROXY_HEADERS:false}
  trusted-proxy-networks: ${VOIDHAVEN_TRUSTED_PROXY_NETWORKS:127.0.0.1/32,::1/128}
  media-endpoint: ${VOIDHAVEN_MEDIA_ENDPOINT:http://localhost:9000}
  media-access-key: ${VOIDHAVEN_MEDIA_ACCESS_KEY:voidhaven-local}
  media-secret-key: ${VOIDHAVEN_MEDIA_SECRET_KEY:change-me-local-only}
  media-bucket: ${VOIDHAVEN_MEDIA_BUCKET:voidhaven-media}
  media-region: ${VOIDHAVEN_MEDIA_REGION:us-east-1}
  media-force-path-style: ${VOIDHAVEN_MEDIA_FORCE_PATH_STYLE:true}
