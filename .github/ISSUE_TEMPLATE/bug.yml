name: 缺陷报告
description: 报告可复现的产品或工程缺陷
title: '[Bug] '
labels: ['type:bug']
body:
  - type: textarea
    id: observed
    attributes:
      label: 实际表现
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期表现
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 最小复现步骤
      description: 不得粘贴密码、令牌、真实联系人或敏感日志。
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: 环境
      options: [本地, 测试服务器, 候选环境, 生产]
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏证据
