spring:
  application:
    name: voidhaven-api
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${VOIDHAVEN_DB_URL:jdbc:mysql://localhost:3306/voidhaven?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${VOIDHAVEN_DB_USERNAME:voidhaven_app}
    password: ${VOIDHAVEN_DB_PASSWORD:change-me-local-only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: Asia/Shanghai
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
server:
  port: ${SERVER_PORT:8081}
  servlet:
    session:
      cookie:
        name: VOIDHAVEN_SESSION
        http-only: true
        secure: ${VOIDHAVEN_COOKIE_SECURE:false}
        same-site: strict
      timeout: 8h
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
voidhaven:
  cookie-secure: ${VOIDHAVEN_COOKIE_SECURE:false}
  public-base-url: ${VOIDHAVEN_PUBLIC_BASE_URL:http://localhost:8080}
  local-fixture-sources-enabled: ${VOIDHAVEN_LOCAL_FIXTURE_SOURCES_ENABLED:false}
  bootstrap-admin-login: ${VOIDHAVEN_BOOTSTRAP_ADMIN_LOGIN:}
  bootstrap-admin-password: ${VOIDHAVEN_BOOTSTRAP_ADMIN_PASSWORD:}
  bootstrap-partner-login: ${VOIDHAVEN_BOOTSTRAP_PARTNER_LOGIN:}
  bootstrap-partner-password: ${VOIDHAVEN_BOOTSTRAP_PARTNER_PASSWORD:}
  community-gate-enabled: ${VOIDHAVEN_COMMUNITY_GATE_ENABLED:false}
  public-write-rate-limit-secret: ${VOIDHAVEN_RATE_LIMIT_SECRET:local-development-rate-limit-secret}
  public-write-rate-limit-max-requests: ${VOIDHAVEN_PUBLIC_WRITE_RATE_LIMIT:8}
  public-write-rate-limit-window-seconds: ${VOIDHAVEN_PUBLIC_WRITE_RATE_LIMIT_WINDOW_SECONDS:3600}
  media-endpoint: ${VOIDHAVEN_MEDIA_ENDPOINT:http://localhost:9000}
  media-access-key: ${VOIDHAVEN_MEDIA_ACCESS_KEY:voidhaven-local}
  media-secret-key: ${VOIDHAVEN_MEDIA_SECRET_KEY:change-me-local-only}
  media-bucket: ${VOIDHAVEN_MEDIA_BUCKET:voidhaven-media}
  media-region: ${VOIDHAVEN_MEDIA_REGION:us-east-1}
  media-force-path-style: ${VOIDHAVEN_MEDIA_FORCE_PATH_STYLE:true}
