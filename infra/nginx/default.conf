server {
  listen 8080;
  server_name _;
  client_max_body_size 6m;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  location = /healthz { proxy_pass http://api:8081/healthz; proxy_set_header X-Forwarded-Proto $scheme; }
  location /api/ { proxy_pass http://api:8081; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
  location / { proxy_pass http://web:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
}
