services:
  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile.candidate
    environment:
      SPRING_PROFILES_ACTIVE: production
      VOIDHAVEN_DB_URL: ${VOIDHAVEN_DB_URL:?Set an externally managed MySQL JDBC URL}
      VOIDHAVEN_DB_USERNAME: ${VOIDHAVEN_DB_USERNAME:?Set the application database user}
      VOIDHAVEN_DB_PASSWORD: ${VOIDHAVEN_DB_PASSWORD:?Inject the application database password}
      VOIDHAVEN_PUBLIC_BASE_URL: ${VOIDHAVEN_PUBLIC_BASE_URL:?Set the canonical HTTPS base URL}
      VOIDHAVEN_COOKIE_SECURE: "true"
      VOIDHAVEN_RATE_LIMIT_SECRET: ${VOIDHAVEN_RATE_LIMIT_SECRET:?Inject a high-entropy public-write rate-limit secret}
      VOIDHAVEN_LOCAL_FIXTURE_SOURCES_ENABLED: "false"
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD-SHELL, "curl --fail --silent http://localhost:8081/actuator/health/readiness | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 6
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 768M }

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile.candidate
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD-SHELL, "wget -q -O - http://localhost:8080/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 6
    deploy:
      resources:
        limits: { cpus: '0.25', memory: 128M }

  nginx:
    image: nginxinc/nginx-unprivileged:1.29-alpine
    ports: ["${VOIDHAVEN_HTTP_PORT:?Set the externally exposed candidate port}:8080"]
    volumes:
      - ../nginx/candidate.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: '0.25', memory: 128M }
