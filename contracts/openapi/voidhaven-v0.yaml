    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 128 } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string, description: JPA 内容版本号 } }
    CommunityGrant:
      {
        name: X-Community-Grant,
        in: header,
        required: true,
        schema: { type: string, minLength: 32, maxLength: 256 },
        description: 仅保存在当前页面内存中的短期授权,
      }
    CommunityGrantOptional:
      {
        name: X-Community-Grant,
        in: header,
        required: false,
        schema: { type: string, minLength: 32, maxLength: 256 },
        description: 可选的短期授权；不携带时响应只包含 PUBLIC 入口,
      }
    PageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
    CsCursor: { name: cursor, in: query, schema: { type: string, maxLength: 256, description: 不透明分页游标，编码当前排序键与唯一 ID } }
    CatalogSort:
      {
        name: sort,
        in: query,
        schema: { type: string, enum: [default, deadline, updated], description: 用户显式排序；缺省时使用运营配置的目录默认排序 },
      }
    CatalogStatus: { name: status, in: query, schema: { type: string, enum: [OPEN, PAUSED, FILLED, EXPIRED, CANCELLED] } }
    SearchQuery: { name: q, in: query, schema: { type: string, maxLength: 240 } }
    ManagementCursor:
      { name: cursor, in: query, schema: { type: string, minLength: 26, maxLength: 26, description: 上一页最后一条管理记录的不透明 ID } }
    StatusFilter:
      { name: status, in: query, schema: { type: string, enum: [DRAFT, PENDING_REVIEW, APPROVED, CHANGES_REQUESTED, REJECTED, PUBLISHED] } }
    ModuleFilter: { name: module, in: query, schema: { type: string, maxLength: 64 } }
    VerificationFilter: { name: verification, in: query, schema: { type: string, enum: [attention, due] } }
  responses:
    HiddenNotFound: { description: 不存在、隐藏、待审或无权限时统一返回 404 }
    IdempotencyConflict: { description: 相同幂等键用于不同请求 }
  schemas:
    ResourceCategory:
      {
        'type': 'object',
        'additionalProperties': false,
        'required': ['key', 'label', 'enabled'],
        'properties':
          {
            'key': { 'type': 'string', 'pattern': '^[A-Za-z][A-Za-z0-9_]{0,63}$' },
            'label': { 'type': 'string', 'minLength': 1, 'maxLength': 80 },
            'enabled': { 'type': 'boolean' },
          },
      }
    ResourceField:
      {
        'type': 'object',
        'additionalProperties': false,
        'required': ['key', 'label', 'enabled', 'type', 'help', 'options'],
        'properties':
          {
            'key': { 'type': 'string', 'pattern': '^[A-Za-z][A-Za-z0-9_]{0,63}$' },
            'label': { 'type': 'string', 'minLength': 1, 'maxLength': 80 },
            'enabled': { 'type': 'boolean' },
            'type': { 'type': 'string', 'enum': ['text', 'textarea', 'date', 'url', 'number', 'select', 'tags'] },
            'help': { 'type': 'string', 'maxLength': 500 },
            'options': { 'type': 'array', 'maxItems': 100, 'items': { 'type': 'string', 'minLength': 1, 'maxLength': 40 } },
          },
      }
    ResourceTemplate:
      {
        'type': 'object',
        'additionalProperties': false,
        'required': ['key', 'label', 'enabled', 'markdown', 'fieldKeys'],
        'properties':
          {
            'key': { 'type': 'string', 'pattern': '^[A-Za-z][A-Za-z0-9_]{0,63}$' },
            'label': { 'type': 'string', 'minLength': 1, 'maxLength': 80 },
            'enabled': { 'type': 'boolean' },
            'markdown': { 'type': 'string', 'maxLength': 262144 },
            'fieldKeys': { 'type': 'array', 'maxItems': 30, 'items': { 'type': 'string' } },
          },
      }
    ResourceConfig:
      {
        'type': 'object',
        'additionalProperties': false,
        'required': ['version', 'categories', 'fields', 'templates'],
        'properties':
          {
            'version': { 'type': 'integer', 'minimum': 1 },
            'categories': { 'type': 'array', 'maxItems': 100, 'items': { '$ref': '#/components/schemas/ResourceCategory' } },
            'fields': { 'type': 'array', 'maxItems': 100, 'items': { '$ref': '#/components/schemas/ResourceField' } },
            'templates': { 'type': 'array', 'maxItems': 50, 'items': { '$ref': '#/components/schemas/ResourceTemplate' } },
          },
      }
    ResourceConfigEnvelope:
      {
        'type': 'object',
        'additionalProperties': false,
        'required': ['requestId', 'data'],
        'properties': { 'requestId': { 'type': 'string' }, 'data': { '$ref': '#/components/schemas/ResourceConfig' } },
      }
    ResourceConfigHistoryEnvelope:
      {
        'type': 'object',
        'additionalProperties': false,
        'required': ['requestId', 'data'],
        'properties':
          {
            'requestId': { 'type': 'string' },
            'data': { 'type': 'array', 'maxItems': 20, 'items': { '$ref': '#/components/schemas/ResourceConfig' } },
          },
      }
    ResourcePresentation:
      {
        'type': ['object', 'null'],
        'description': '发布修订的公开展示快照，不含模板或后台管理数据',
        'properties':
          {
            'category': { 'type': ['string', 'null'] },
            'fields': { 'type': 'array', 'maxItems': 30, 'items': { '$ref': '#/components/schemas/ResourceField' } },
          },
      }
    ProductCapabilitiesEnvelope:
      type: object
      required: [data, requestId]
      properties:
        requestId: { type: string }
        data:
          type: object
          required: [privateContactEnabled, communityGateEnabled, gatedRecruitmentEnabled, statusQueryEnabled, projectJoinEnabled]
          properties:
            privateContactEnabled:
              type: boolean
              description: 是否可安全收集和读取私密联系方式
            communityGateEnabled:
              type: boolean
              description: 邀请码、短期授权及社群入口是否已完整配置
            gatedRecruitmentEnabled:
              type: boolean
              description: 受控招募联系方式和二维码是否可用
            statusQueryEnabled:
              type: boolean
              description: 回执号与查询码状态查询是否可用
            projectJoinEnabled:
              type: boolean
              description: 是否存在已启用的项目组行动入口
    SubmissionRequest:
      type: object
      required: [submissionType, title, message]
      properties:
        submissionType: { type: string, enum: [CONTENT, FEEDBACK, COPYRIGHT] }
        title: { type: string, maxLength: 240 }
        message: { type: string, maxLength: 5000 }
        linkUrl: { type: [string, 'null'], format: uri }
        imageDescription: { type: [string, 'null'], maxLength: 1000 }
        contact:
          { type: [string, 'null'], minLength: 3, maxLength: 500, writeOnly: true, description: CONTENT/FEEDBACK 可选，COPYRIGHT 必填。 }
    PartnerApplicationRequest:
      type: object
      required: [displayName, introduction, contact]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }
        introduction: { type: string, minLength: 1, maxLength: 5000 }
        portfolioUrl: { type: [string, 'null'], format: uri }
        contact: { type: string, minLength: 3, maxLength: 500, writeOnly: true }
    CreatedCaseEnvelope:
      type: object
      required: [data, requestId]
      properties:
        requestId: { type: string }
        data:
          type: object
          required: [id, queryCode]
          properties:
            id: { type: string, minLength: 26, maxLength: 26 }
            queryCode: { type: string, writeOnly: true, description: 仅本次返回，服务端只保存摘要。 }
    CaseQueryRequest:
      type: object
      required: [id, queryCode]
      properties:
        id: { type: string, minLength: 26, maxLength: 26 }
        queryCode: { type: string, minLength: 16, maxLength: 256, writeOnly: true }
    CaseStatusEnvelope:
      type: object
      required: [data, requestId]
      properties:
        requestId: { type: string }
        data:
          type: object
          required: [id, status, createdAt, updatedAt]
          properties:
            id: { type: string }
            status: { type: string }
            publicResult: { type: [string, 'null'], maxLength: 2000 }
            dueAt: { type: [string, 'null'], format: date-time }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    CommunityVerifyRequest:
      type: object
      required: [inviteCode]
      properties:
        inviteCode: { type: string, minLength: 8, maxLength: 256, writeOnly: true }
    CommunityGrantEnvelope:
      type: object
      required: [data, requestId]
      properties:
        requestId: { type: string }
        data:
          type: object
          required: [grant, expiresAt]
          properties:
            grant: { type: string, writeOnly: true }
            expiresAt: { type: string, format: date-time }
    HomeEnvelope:
      type: object
      required: [data, requestId]
      properties:
        requestId: { type: string }
        data:
          type: object
          required: [focus, competitions, recruitments, resources]
          properties:
            focus: { type: array, items: { $ref: '#/components/schemas/PublicContent' } }
            competitions: { type: array, items: { $ref: '#/components/schemas/PublicContent' } }
            recruitments: { type: array, items: { $ref: '#/components/schemas/PublicContent' } }
            resources: { type: array, items: { $ref: '#/components/schemas/PublicContent' } }
    PublicPageEnvelope:
      type: object
      required: [data, requestId]
      properties:
        requestId: { type: string }
        data:
          type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/PublicContent' } }
            nextCursor: { type: [string, 'null'] }
            sort: { type: [string, 'null'], enum: [default, deadline, updated] }
    PublicContent:
      type: object
      required:
        [
          id,
          kind,
          moduleKey,
          schemaVersion,
          title,
          summary,
          body,
          languageCode,
          languageLabel,
          sourceName,
          rightsBasis,
          authorDisplayName,
          reprintPermission,
          adaptationPermission,
          details,
          revision,
          media,
        ]
      properties:
        id: { type: string }
        kind: { type: string, enum: [COMPETITION, RESOURCE, RECRUITMENT] }
        moduleKey: { type: string, maxLength: 64, description: 版本控制的模块键；例如 resource.article。 }
        schemaVersion: { type: integer, minimum: 1 }
        resourceConfigVersion: { type: [integer, 'null'], minimum: 1 }
        resourcePresentation: { $ref: '#/components/schemas/ResourcePresentation' }
        title: { type: string, maxLength: 240 }
        summary: { type: string, maxLength: 1000 }
        body: { $ref: '#/components/schemas/RichTextDocument' }
        languageCode: { type: string }
        languageLabel: { type: string, enum: [中文, 英文, 中英双语], description: other:具体语种 时返回“其他语言（具体语种）”。 }
        originalTitle: { type: [string, 'null'], maxLength: 240, description: 非中文内容的原始标题。 }
        sourceName: { type: string }
        sourceUrl: { type: [string, 'null'], format: uri, description: 原创文章可为空；其他公开内容必须是可核验 HTTPS 来源。 }
        rightsBasis: { type: string }
        authorDisplayName: { type: string, maxLength: 120 }
        reprintPermission: { type: string, enum: [NOT_ALLOWED, ATTRIBUTION_ALLOWED] }
        adaptationPermission: { type: string, enum: [NOT_ALLOWED, ATTRIBUTION_ALLOWED] }
        details:
          type: object
          description: 类型专属信息；RESOURCE 的分类、标签和 customFields 均可选，空分类由服务端规范化为 GENERAL。其余既有字段保持兼容。
          properties:
            resourceType: { type: string, maxLength: 64 }
            tags: { type: array, maxItems: 20, items: { type: string, minLength: 1, maxLength: 40 } }
            customFields:
              type: object
              maxProperties: 30
              description: 按管理员声明的字段标识和类型验证；不接受未知字段；非空写入须携带 resourceConfigVersion。
              additionalProperties:
                type: [string, number, array, 'null']
                items: { type: string }

        revision: { type: integer }
        media: { type: array, items: { $ref: '#/components/schemas/PublicMedia' } }
        verification:
          anyOf: [{ $ref: '#/components/schemas/PublicContentVerification' }, { type: 'null' }]
        operationalStatus: { type: [string, 'null'] }
        updatedAt: { type: [string, 'null'], format: date-time }
    PublicAction:
      type: object
      required: [id, presentationType, contactChannel, label, accessLevel]
      properties:
        id: { type: string, minLength: 26, maxLength: 26 }
        presentationType: { $ref: '#/components/schemas/PresentationType' }
        contactChannel: { $ref: '#/components/schemas/ContactChannel' }
        accessLevel: { $ref: '#/components/schemas/EntryAccessLevel' }
        label: { type: string, minLength: 1, maxLength: 120 }
        value: { type: [string, 'null'], maxLength: 2048 }
        mediaUrl: { type: [string, 'null'], pattern: '^/api/v1/public/(media|community/media)/[A-Za-z0-9]+$' }
    ManagedAction:
      type: object
      required: [id, presentationType, contactChannel, accessLevel, label, enabled, sortOrder]
      properties:
        id: { type: string, minLength: 26, maxLength: 26 }
        presentationType: { $ref: '#/components/schemas/PresentationType' }
        contactChannel: { $ref: '#/components/schemas/ContactChannel' }
        accessLevel: { $ref: '#/components/schemas/EntryAccessLevel' }
        label: { type: string, minLength: 1, maxLength: 120 }
        value: { type: [string, 'null'], maxLength: 2048 }
        mediaAssetId: { type: [string, 'null'], minLength: 26, maxLength: 26 }
        enabled: { type: boolean }
        sortOrder: { type: integer, minimum: 0, maximum: 1000 }
    ContentActionInput:
      type: object
      required: [presentationType, contactChannel, accessLevel, label, publicExposureConfirmed, enabled, sortOrder]
      properties:
        presentationType: { $ref: '#/components/schemas/PresentationType' }
        contactChannel: { $ref: '#/components/schemas/ContactChannel' }
        accessLevel: { $ref: '#/components/schemas/EntryAccessLevel' }
        label: { type: string, minLength: 1, maxLength: 120 }
        value: { type: [string, 'null'], maxLength: 2048 }
        mediaAssetId: { type: [string, 'null'], minLength: 26, maxLength: 26 }
        publicExposureConfirmed: { type: boolean, description: 公开个人联系方式时必须为 true }
        enabled: { type: boolean }
        sortOrder: { type: integer, minimum: 0, maximum: 1000 }
    ContentActionSetRequest:
      type: object
      required: [actions]
      properties:
        actions: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/ContentActionInput' } }
    ManagedActionListEnvelope:
      type: object
      required: [data, requestId]
      properties:
        requestId: { type: string }
        data: { type: array, items: { $ref: '#/components/schemas/ManagedAction' } }
    ContentActionSetEnvelope:
      type: object
      required: [data, requestId]
      properties:
        requestId: { type: string }
        data:
          type: object
          required: [contentId, version, workflowStatus, candidateCreated, actions]
          properties:
            contentId: { type: string, minLength: 26, maxLength: 26 }
            version: { type: integer, format: int64 }
            workflowStatus: { type: string, enum: [DRAFT, CHANGES_REQUESTED] }
            candidateCreated: { type: boolean }
            actions: { type: array, items: { $ref: '#/components/schemas/ManagedAction' } }
    PresentationType: { type: string, enum: [LINK, QR_CODE, TEXT] }
    ContactChannel: { type: string, enum: [URL, EMAIL, WECHAT, QQ, PHONE, OTHER] }
    EntryAccessLevel: { type: string, enum: [PUBLIC, COMMUNITY_GATED] }
    CommunityEntry:
      type: object
      required: [id, name, presentationType, contactChannel, accessLevel, primary, sortOrder]
      properties:
        id: { type: string, minLength: 26, maxLength: 26 }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 1000 }
        presentationType: { $ref: '#/components/schemas/PresentationType' }
        contactChannel: { $ref: '#/components/schemas/ContactChannel' }
        accessLevel: { $ref: '#/components/schemas/EntryAccessLevel' }
        value: { type: [string, 'null'], maxLength: 2048 }
        mediaUrl: { type: [string, 'null'], pattern: '^/api/v1/public/(media|community/media)/[A-Za-z0-9]+$' }
        primary: { type: boolean }
        sortOrder: { type: integer }
    CommunityEntryListEnvelope:
      type: object
      required: [data, requestId]
      properties:
        requestId: { type: string }
        data: { type: array, items: { $ref: '#/components/schemas/CommunityEntry' } }
    CommunityEntryWrite:
      type: object
      required: [name, presentationType, contactChannel, accessLevel, publicExposureConfirmed, primary, sortOrder]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 1000 }
        presentationType: { $ref: '#/components/schemas/PresentationType' }
        contactChannel: { $ref: '#/components/schemas/ContactChannel' }
        accessLevel: { $ref: '#/components/schemas/EntryAccessLevel' }
        value: { type: [string, 'null'], maxLength: 2048 }
        mediaAssetId: { type: [string, 'null'], minLength: 26, maxLength: 26 }
        publicExposureConfirmed: { type: boolean, description: 公开个人联系方式时必须为 true }
        primary: { type: boolean }
        sortOrder: { type: integer, minimum: 0, maximum: 1000 }
    ProjectJoinEntry:
      type: object
      required: [id, name, presentationType, contactChannel, accessLevel, sortOrder]
      properties:
        id: { type: string, minLength: 26, maxLength: 26 }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 1000 }
        presentationType: { $ref: '#/components/schemas/PresentationType' }
        contactChannel: { $ref: '#/components/schemas/ContactChannel' }
        accessLevel: { $ref: '#/components/schemas/EntryAccessLevel' }
        value: { type: [string, 'null'], maxLength: 2048 }
        mediaUrl: { type: [string, 'null'], pattern: '^/api/v1/public/(media|community/media)/[A-Za-z0-9]+$' }
        sortOrder: { type: integer }
    ProjectJoinEntryListEnvelope:
      type: object
      required: [data, requestId]
      properties:
        requestId: { type: string }
        data: { type: array, items: { $ref: '#/components/schemas/ProjectJoinEntry' } }
    ProjectJoinEntryWrite:
      type: object
      required: [name, presentationType, contactChannel, accessLevel, publicExposureConfirmed, sortOrder]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 1000 }
        presentationType: { $ref: '#/components/schemas/PresentationType' }
        contactChannel: { $ref: '#/components/schemas/ContactChannel' }
        accessLevel: { $ref: '#/components/schemas/EntryAccessLevel' }
        value: { type: [string, 'null'], maxLength: 2048 }
        mediaAssetId: { type: [string, 'null'], minLength: 26, maxLength: 26 }
        publicExposureConfirmed: { type: boolean, description: 公开个人联系方式或二维码时必须为 true }
        sortOrder: { type: integer, minimum: 0, maximum: 1000 }
    PublicContentVerification:
      type: object
      required: [outcome, checkedAt]
      properties:
        outcome: { type: string, enum: [VALID, INVALID, NEEDS_REVIEW] }
        checkedAt: { type: string, format: date-time }
    PublicMedia:
      type: object
      required: [id, url, mediaType, width, height, altText]
      properties:
        id: { type: string, minLength: 26, maxLength: 26 }
        url:
          {
            type: string,
            pattern: '^/api/v1/(public/media/[A-Za-z0-9]+|media/[A-Za-z0-9]+/preview)$',
            description: 公开投影只返回 public/media；候选修订只返回受控 preview。,
          }
        mediaType: { type: string, enum: [image/jpeg, image/png] }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        altText: { type: string, maxLength: 240 }
    MediaEnvelope:
      type: object
      required: [data, requestId]
      properties:
        requestId: { type: string }
        data: { $ref: '#/components/schemas/PublicMedia' }
    RichTextDocument:
      type: object
      required: [version, blocks]
      additionalProperties: false
      properties:
        version: { type: integer, enum: [1, 2], description: 1 为历史段落文档；2 为服务端解析后的受控 Markdown 文档。 }
        blocks:
          type: array
          minItems: 1
          maxItems: 400
          items:
            type: object
            description: 仅服务端允许的 paragraph、heading、quote、list、code、rule、image 块；任何 HTML、脚本、远程图片或未声明属性均被拒绝。
    ContentDraft:
      type: object
      required:
        [
          moduleKey,
          schemaVersion,
          title,
          summary,
          body,
          markdownSource,
          languageCode,
          rightsBasis,
          authorDisplayName,
          reprintPermission,
          adaptationPermission,
          details,
        ]
      properties:
        kind: { type: string, enum: [COMPETITION, RESOURCE, RECRUITMENT] }
        moduleKey: { type: string, maxLength: 64 }
        schemaVersion: { type: integer, minimum: 1 }
        resourceConfigVersion: { type: [integer, 'null'], minimum: 1 }
        title: { type: string, maxLength: 240 }
        summary: { type: string, maxLength: 1000 }
        body: { $ref: '#/components/schemas/RichTextDocument' }
        markdownSource: { type: string, minLength: 1, maxLength: 262144, description: 作者 Markdown 原文；服务端解析为安全正文结构。 }
        languageCode:
          oneOf:
            - { type: string, enum: [zh-CN, en, 'zh-CN,en'] }
            - { type: string, pattern: '^other:[A-Za-z][A-Za-z -]{1,29}$' }
        originalTitle: { type: [string, 'null'], maxLength: 240, description: 非中文内容必填。 }
        sourceUrl: { type: [string, 'null'], format: uri }
        sourceName: { type: [string, 'null'], maxLength: 240 }
        rightsBasis: { type: string, maxLength: 120 }
        authorDisplayName: { type: string, maxLength: 120 }
        reprintPermission: { type: string, enum: [NOT_ALLOWED, ATTRIBUTION_ALLOWED] }
        adaptationPermission: { type: string, enum: [NOT_ALLOWED, ATTRIBUTION_ALLOWED] }
        details:
          type: object
          description: 类型专属信息；RESOURCE 的分类、标签和 customFields 均可选，空分类由服务端规范化为 GENERAL。其余既有字段保持兼容。
          properties:
            resourceType: { type: string, maxLength: 64 }
            tags: { type: array, maxItems: 20, items: { type: string, minLength: 1, maxLength: 40 } }
            customFields:
              type: object
              maxProperties: 30
              description: 按管理员声明的字段标识和类型验证；不接受未知字段；非空写入须携带 resourceConfigVersion。
              additionalProperties:
                type: [string, number, array, 'null']
                items: { type: string }

    ContentModuleSetEnvelope:
      type: object
      required: [data, requestId]
      properties:
        requestId: { type: string }
        data: { $ref: '#/components/schemas/ContentModuleSet' }
    EditableContentEnvelope:
      type: object
      required: [data, requestId]
      properties:
        requestId: { type: string }
        data: { $ref: '#/components/schemas/EditableContent' }
    EditableContent:
      type: object
      required: [id, draft, revision, workflowStatus, publicationStatus, visibility, recordState, media, reviews]
      properties:
        id: { type: string, minLength: 26, maxLength: 26 }
        resourceConfig: { $ref: '#/components/schemas/ResourceConfig' }
        draft: { $ref: '#/components/schemas/ContentDraft' }
        revision: { type: integer, minimum: 0 }
        workflowStatus: { type: string }
        publicationStatus: { type: string, enum: [NONE, ACTIVE, CLOSED] }
        visibility: { type: string, enum: [PUBLIC, HIDDEN] }
        recordState: { type: string, enum: [ACTIVE, ARCHIVED, DELETED] }
        ownerPartnerProfileId: { type: [string, 'null'] }
