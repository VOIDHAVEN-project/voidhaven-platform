server {
  listen 8080;
  server_name _;
  resolver 127.0.0.11 valid=5s ipv6=off;
  set $api_upstream api:8081;
  set $web_upstream web:8080;
  client_max_body_size 6m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
  # Only enable this header at the TLS-terminating production ingress.
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location = /healthz {
    proxy_pass http://$api_upstream$request_uri;
    proxy_set_header X-Forwarded-Proto https;
  }

  location /api/ {
    proxy_pass http://$api_upstream$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
  }

  location / {
    proxy_pass http://$web_upstream$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }
}
