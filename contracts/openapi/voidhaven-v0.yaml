openapi: 3.1.0
info:
  title: VOIDHAVEN V0 API
  version: 0.1.0
  description: 公开读取、公开输入和受控后台的接口契约。所有写入接口均使用 Idempotency-Key；私密字段绝不出现在公开响应。
servers: [{ url: /api/v1 }]
paths:
  /public/home:
    get:
      summary: 首页三栏投影
      responses: { '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/HomeEnvelope' } } } } }
  /public/content-modules:
    get:
      summary: 当前公开内容模块定义、显示名称与可筛选字段
      responses: { '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/ContentModuleSetEnvelope' } } } } }
  /public/content:
    get:
      summary: 按可演进模块键读取公开内容；模块键由内容模块定义提供
      parameters: [{ name: module, in: query, required: true, schema: { type: string, maxLength: 64 } }, { name: filterKey, in: query, required: false, schema: { type: string, maxLength: 64 } }, { name: filterValue, in: query, required: false, schema: { type: string, maxLength: 512 } }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/CsCursor' }, { $ref: '#/components/parameters/SearchQuery' }]
      responses: { '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/PublicPageEnvelope' } } } }, '400': { description: 模块不存在或已停用 } }
  /public/content/{id}:
    get:
      summary: 按稳定不透明 ID 读取公开详情；不依赖内容模块或标题
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/PublicContentEnvelope' } } } }, '404': { $ref: '#/components/responses/HiddenNotFound' } }
  /public/competitions:
    get:
      summary: 公开竞赛列表（服务端筛选与 Cursor 分页）
      parameters: [{ $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/CsCursor' }, { $ref: '#/components/parameters/SearchQuery' }]
      responses: { '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/PublicPageEnvelope' } } } } }
  /public/competitions/{id}:
    get:
      summary: 公开竞赛详情
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: 成功 }, '404': { $ref: '#/components/responses/HiddenNotFound' } }
  /public/resources:
    get:
      summary: 公开学习资源列表（服务端筛选与 Cursor 分页）
      parameters: [{ $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/CsCursor' }, { $ref: '#/components/parameters/SearchQuery' }]
      responses: { '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/PublicPageEnvelope' } } } } }
  /public/resources/{id}:
    get: { summary: 公开学习资源详情, parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { description: 成功 }, '404': { $ref: '#/components/responses/HiddenNotFound' } } }
  /public/recruitments:
    get:
      summary: 公开团队招募列表（服务端筛选与 Cursor 分页）
      parameters: [{ $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/CsCursor' }, { $ref: '#/components/parameters/SearchQuery' }]
      responses: { '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/PublicPageEnvelope' } } } } }
  /public/recruitments/{id}:
    get: { summary: 公开团队招募详情, parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { description: 成功 }, '404': { $ref: '#/components/responses/HiddenNotFound' } } }
  /public/media/{id}:
    get:
      summary: 仅当媒体仍关联于公开、活跃内容时读取处理后的图片；响应不缓存
      parameters: [{ $ref: '#/components/parameters/MediaId' }]
      responses:
        '200': { description: 处理后的 JPEG 或 PNG 图片，Cache-Control 为 no-store, content: { image/jpeg: {}, image/png: {} } }
        '404': { $ref: '#/components/responses/HiddenNotFound' }
  /public/submissions:
    post:
      summary: 公开投稿或反馈；只接收文字、链接和图片说明
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SubmissionRequest' } } } }
      responses: { '201': { description: 已进入审核 }, '409': { $ref: '#/components/responses/IdempotencyConflict' } }
  /public/partner-applications:
    post:
      summary: 公开合作方申请
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '201': { description: 已进入审核 } }
  /auth/session:
    post: { summary: 受控账号登录, responses: { '200': { description: 会话已创建 }, '401': { description: 通用认证失败 } } }
    delete: { summary: 销毁当前会话, responses: { '204': { description: 已退出 } } }
  /auth/me:
    get: { summary: 当前受控身份, responses: { '200': { description: 成功 }, '401': { description: 未认证 } } }
  /auth/csrf:
    get: { summary: 获取受控写操作的 CSRF 令牌, responses: { '200': { description: 成功 } } }
  /auth/activation/consume:
    post:
      summary: 使用一次性激活令牌设置首个密码
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ActivationRequest' } } } }
      responses: { '200': { description: 已激活 }, '400': { description: 令牌无效、已使用或已过期 } }
  /content-modules:
    get:
      summary: 受控编辑器使用的当前内容模块定义
      responses: { '200': { description: 成功 }, '401': { description: 未认证 }, '403': { description: 不是合作方或管理员 } }
  /media/uploads:
    post:
      summary: 合作方或管理员向自己的可编辑候选修订上传一张正文图片
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [contentItemId, altText, file]
              properties:
                contentItemId: { type: string, minLength: 26, maxLength: 26 }
                altText: { type: string, minLength: 1, maxLength: 240 }
                file: { type: string, format: binary, description: 实际文件类型必须为 JPEG、PNG 或 WebP；服务端重编码后仅保存 JPEG/PNG。 }
      responses:
        '200': { description: 图片已安全处理并关联候选修订, content: { application/json: { schema: { $ref: '#/components/schemas/MediaEnvelope' } } } }
        '400': { description: 类型、尺寸、大小或图片说明不合规 }
        '403': { description: 未认证或不具备合作方/管理员资格 }
        '404': { $ref: '#/components/responses/HiddenNotFound' }
        '409': { description: 候选状态、图片数量/总量或幂等键冲突 }
  /partner/dashboard:
    get: { summary: 合作方自己的配额和内容工作台, responses: { '200': { description: 成功 }, '403': { description: 无有效合作方档案 } } }
  /partner/content-items:
    get: { summary: 合作方自己的内容, responses: { '200': { description: 成功 }, '403': { description: 权限不足 } } }
    post: { summary: 创建草稿, parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }], responses: { '201': { description: 已创建 } } }
  /partner/content-items/{id}:
    get:
      summary: 合作方读取自己的可编辑候选修订及已关联媒体
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: 可编辑草稿, content: { application/json: { schema: { $ref: '#/components/schemas/EditableContentEnvelope' } } } }, '404': { $ref: '#/components/responses/HiddenNotFound' } }
    patch:
      summary: 合作方创建候选修订
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ContentDraft' } } } }
      responses: { '200': { description: 已创建候选修订 }, '404': { $ref: '#/components/responses/HiddenNotFound' }, '409': { description: 版本或状态冲突 } }
  /partner/content-items/{id}/submit-review:
    post: { summary: 合作方送审自己的草稿, parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }], responses: { '200': { description: 已送审 }, '404': { $ref: '#/components/responses/HiddenNotFound' } } }
  /admin/review-queue:
    get: { summary: 管理员审核队列, responses: { '200': { description: 成功 }, '403': { description: 权限不足 } } }
  /admin/content-items:
    get: { summary: 管理员内容列表, responses: { '200': { description: 成功 } } }
    post:
      summary: 管理员创建或代录草稿
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ContentDraft' } } } }
      responses: { '200': { description: 已创建 } }
  /admin/content-items/{id}:
    get:
      summary: 管理员读取一个可编辑候选修订
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: 可编辑草稿, content: { application/json: { schema: { $ref: '#/components/schemas/EditableContentEnvelope' } } } }, '404': { $ref: '#/components/responses/HiddenNotFound' } }
    patch:
      summary: 管理员创建候选修订
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ContentDraft' } } } }
      responses: { '200': { description: 已创建候选修订 }, '409': { description: 版本冲突 } }
  /admin/content-items/{id}/submit-review:
    post: { summary: 管理员送审草稿, parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }], responses: { '200': { description: 已送审 } } }
  /admin/reviews/{id}/decision:
    post:
      summary: 管理员审核通过、退回或拒绝
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewDecision' } } } }
      responses: { '200': { description: 已记录审核决定 } }
  /admin/content-items/{id}/publish:
    post: { summary: 发布已通过内容, parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }], responses: { '200': { description: 已发布 }, '409': { description: 状态或配额冲突 } } }
  /admin/content-items/{id}/hide:
    post: { summary: 隐藏内容, parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }], responses: { '200': { description: 已隐藏 } } }
  /admin/content-items/{id}/show:
    post: { summary: 重新公开已隐藏的已发布内容, parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }], responses: { '200': { description: 已重新公开 } } }
  /admin/content-items/{id}/archive:
    post: { summary: 归档内容, parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }], responses: { '200': { description: 已归档 } } }
  /admin/content-items/{id}/restore:
    post: { summary: 恢复归档内容为隐藏状态, parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }], responses: { '200': { description: 已恢复 } } }
  /admin/partner-applications:
    get: { summary: 待处理合作方申请（不返回私密联系方式）, responses: { '200': { description: 成功 } } }
  /admin/partner-applications/{id}/approve:
    post:
      summary: 批准申请并一次性返回待交付的激活凭据
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ApprovePartnerApplication' } } } }
      responses: { '200': { description: 凭据仅在此首次响应中出现 }, '409': { description: 申请已处理或凭据不可重放 } }
  /admin/partner-applications/{id}/decision:
    post:
      summary: 退回修改或拒绝合作方申请；不返回私密联系方式
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PartnerApplicationDecision' } } } }
      responses: { '200': { description: 审核状态已更新 }, '409': { description: 申请已处理 } }
  /admin/submissions:
    get: { summary: 待审核的公开投稿、反馈和版权请求；不返回私密联系方式, responses: { '200': { description: 成功 } } }
  /admin/submissions/{id}/decision:
    post:
      summary: 审核公开投稿、反馈或版权请求
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PublicInputDecision' } } } }
      responses: { '200': { description: 审核状态已更新 }, '409': { description: 请求已处理 } }
  /admin/partner-profiles:
    get: { summary: 合作方档案与当前配额, responses: { '200': { description: 成功 } } }
  /admin/partner-profiles/{id}/content-quota:
    patch:
      summary: 设置 0–5 条公开活跃内容配额
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/QuotaChange' } } } }
      responses: { '200': { description: 配额已更新 } }
  /admin/content-ownership-transfers:
    post:
      summary: 管理员转交内容归属
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OwnershipTransfer' } } } }
      responses: { '200': { description: 已转交 } }
  /admin/accounts/{id}/qualification-status:
    patch:
      summary: 超级管理员停用或撤销受控账号；下一次受限请求会使既有会话失效
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AccountQualificationChange' } } } }
      responses: { '200': { description: 账号资格已更新 }, '401': { description: 被停用账号的会话已失效 }, '403': { description: 仅超级管理员 } }
  /admin/audit-logs:
    get: { summary: 最小审计摘要查询, parameters: [{ name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }], responses: { '200': { description: 成功，不含密码、令牌、私密正文或联系方式 } } }
components:
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, minLength: 26, maxLength: 26 } }
    MediaId: { name: id, in: path, required: true, schema: { type: string, minLength: 26, maxLength: 26 } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 128 } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string, description: JPA 内容版本号 } }
    PageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
    CsCursor: { name: cursor, in: query, schema: { type: string, description: 上一页最后一条不透明 ID } }
    SearchQuery: { name: q, in: query, schema: { type: string, maxLength: 240 } }
  responses:
    HiddenNotFound: { description: 不存在、隐藏、待审或无权限时统一返回 404 }
    IdempotencyConflict: { description: 相同幂等键用于不同请求 }
  schemas:
    SubmissionRequest:
      type: object
      required: [submissionType, title, message]
      properties:
        submissionType: { type: string, enum: [CONTENT, FEEDBACK, COPYRIGHT] }
        title: { type: string, maxLength: 240 }
        message: { type: string, maxLength: 5000 }
        linkUrl: { type: [string, 'null'], format: uri }
        imageDescription: { type: [string, 'null'], maxLength: 1000 }
    HomeEnvelope:
      type: object
      required: [data, requestId]
      properties:
        requestId: { type: string }
        data: { type: object }
    PublicPageEnvelope:
      type: object
      required: [data, requestId]
      properties:
        requestId: { type: string }
        data:
          type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/PublicContent' } }
            nextCursor: { type: [string, 'null'] }
    PublicContent:
      type: object
      required: [id, kind, moduleKey, schemaVersion, title, summary, body, languageCode, languageLabel, sourceName, rightsBasis, authorDisplayName, reprintPermission, adaptationPermission, details, revision, media]
      properties:
        id: { type: string }
        kind: { type: string, enum: [COMPETITION, RESOURCE, RECRUITMENT] }
        moduleKey: { type: string, maxLength: 64, description: 版本控制的模块键；例如 resource.article。 }
        schemaVersion: { type: integer, minimum: 1 }
        title: { type: string, maxLength: 240 }
        summary: { type: string, maxLength: 1000 }
        body: { $ref: '#/components/schemas/RichTextDocument' }
        languageCode: { type: string }
        languageLabel: { type: string, enum: [中文, 英文, 中英双语], description: other:具体语种 时返回“其他语言（具体语种）”。 }
        originalTitle: { type: [string, 'null'], maxLength: 240, description: 非中文内容的原始标题。 }
        sourceName: { type: string }
        sourceUrl: { type: [string, 'null'], format: uri, description: 原创文章可为空；其他公开内容必须是可核验 HTTPS 来源。 }
        rightsBasis: { type: string }
        authorDisplayName: { type: string, maxLength: 120 }
        reprintPermission: { type: string, enum: [NOT_ALLOWED, ATTRIBUTION_ALLOWED] }
        adaptationPermission: { type: string, enum: [NOT_ALLOWED, ATTRIBUTION_ALLOWED] }
        details: { type: object }
        revision: { type: integer }
        media: { type: array, items: { $ref: '#/components/schemas/PublicMedia' } }
    PublicMedia:
      type: object
      required: [id, url, mediaType, width, height, altText]
      properties:
        id: { type: string, minLength: 26, maxLength: 26 }
        url: { type: string, pattern: '^/api/v1/public/media/[A-Za-z0-9]+$' }
        mediaType: { type: string, enum: [image/jpeg, image/png] }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        altText: { type: string, maxLength: 240 }
    MediaEnvelope:
      type: object
      required: [data, requestId]
      properties:
        requestId: { type: string }
        data: { $ref: '#/components/schemas/PublicMedia' }
    RichTextDocument:
      type: object
      required: [version, blocks]
      additionalProperties: false
      properties:
        version: { type: integer, enum: [1, 2], description: 1 为历史段落文档；2 为服务端解析后的受控 Markdown 文档。 }
        blocks:
          type: array
          minItems: 1
          maxItems: 400
          items:
            type: object
            description: 仅服务端允许的 paragraph、heading、quote、list、code、rule、image 块；任何 HTML、脚本、远程图片或未声明属性均被拒绝。
    ContentDraft:
      type: object
      required: [moduleKey, schemaVersion, title, summary, body, markdownSource, languageCode, rightsBasis, authorDisplayName, reprintPermission, adaptationPermission, details]
      properties:
        kind: { type: string, enum: [COMPETITION, RESOURCE, RECRUITMENT] }
        moduleKey: { type: string, maxLength: 64 }
        schemaVersion: { type: integer, minimum: 1 }
        title: { type: string, maxLength: 240 }
        summary: { type: string, maxLength: 1000 }
        body: { $ref: '#/components/schemas/RichTextDocument' }
        markdownSource: { type: string, minLength: 1, maxLength: 262144, description: 作者 Markdown 原文；服务端解析为安全正文结构。 }
        languageCode:
          oneOf:
            - { type: string, enum: [zh-CN, en, 'zh-CN,en'] }
            - { type: string, pattern: '^other:[A-Za-z][A-Za-z -]{1,29}$' }
        originalTitle: { type: [string, 'null'], maxLength: 240, description: 非中文内容必填。 }
        sourceUrl: { type: [string, 'null'], format: uri }
        sourceName: { type: [string, 'null'], maxLength: 240 }
        rightsBasis: { type: string, maxLength: 120 }
        authorDisplayName: { type: string, maxLength: 120 }
        reprintPermission: { type: string, enum: [NOT_ALLOWED, ATTRIBUTION_ALLOWED] }
        adaptationPermission: { type: string, enum: [NOT_ALLOWED, ATTRIBUTION_ALLOWED] }
        details: { type: object }
    ContentModuleSetEnvelope:
      type: object
      required: [data, requestId]
      properties:
        requestId: { type: string }
        data: { $ref: '#/components/schemas/ContentModuleSet' }
    EditableContentEnvelope:
      type: object
      required: [data, requestId]
      properties:
        requestId: { type: string }
        data: { $ref: '#/components/schemas/EditableContent' }
    EditableContent:
      type: object
      required: [id, draft, revision, workflowStatus, visibility, recordState, media]
      properties:
        id: { type: string, minLength: 26, maxLength: 26 }
        draft: { $ref: '#/components/schemas/ContentDraft' }
        revision: { type: integer, minimum: 0 }
        workflowStatus: { type: string }
        visibility: { type: string, enum: [PUBLIC, HIDDEN] }
        recordState: { type: string, enum: [ACTIVE, ARCHIVED, DELETED] }
        media: { type: array, items: { $ref: '#/components/schemas/PublicMedia' } }
    ContentModuleSet:
      type: object
      required: [version, modules]
      properties:
        version: { type: integer, minimum: 1 }
        modules:
          type: array
          items: { $ref: '#/components/schemas/ContentModule' }
    ContentModule:
      type: object
      required: [key, label, legacyKind, active, fields]
      properties:
        key: { type: string, maxLength: 64 }
        label: { type: string }
        legacyKind: { type: string, enum: [COMPETITION, RESOURCE, RECRUITMENT] }
        active: { type: boolean }
        allowsOriginalSource: { type: boolean }
        requiresOfficialRules: { type: boolean }
        deadlinePolicy: { type: string }
        template: { type: string }
        fields:
          type: array
          items:
            type: object
            required: [key, label, type, required, filterable]
            properties:
              key: { type: string }
              label: { type: string }
              type: { type: string, enum: [text, textarea, url, date, datetime, relation, select, boolean, number, tags] }
              required: { type: boolean }
              filterable: { type: boolean }
              options: { type: array, items: { type: string } }
              help: { type: string }
    PublicContentEnvelope:
      type: object
      required: [data, requestId]
      properties:
        requestId: { type: string }
        data: { $ref: '#/components/schemas/PublicContent' }
    ReviewDecision:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [APPROVE, CHANGES_REQUESTED, REJECT] }
        reason: { type: [string, 'null'], maxLength: 1000 }
    ActivationRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string }
        password: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
    ApprovePartnerApplication:
      type: object
      required: [loginId]
      properties:
        loginId: { type: string, pattern: '^[A-Za-z0-9._-]{4,100}$' }
    QuotaChange:
      type: object
      required: [quota, reason]
      properties:
        quota: { type: integer, minimum: 0, maximum: 5 }
        reason: { type: string, maxLength: 1000 }
    OwnershipTransfer:
      type: object
      required: [contentItemId, toPartnerProfileId, reason]
      properties:
        contentItemId: { type: string, minLength: 26, maxLength: 26 }
        toPartnerProfileId: { type: string, minLength: 26, maxLength: 26 }
        reason: { type: string, maxLength: 1000 }
    PublicInputDecision:
      type: object
      required: [decision, reason]
      properties:
        decision: { type: string, enum: [APPROVE, CHANGES_REQUESTED, REJECT] }
        reason: { type: string, maxLength: 1000 }
    PartnerApplicationDecision:
      type: object
      required: [decision, reason]
      properties:
        decision: { type: string, enum: [CHANGES_REQUESTED, REJECT] }
        reason: { type: string, maxLength: 1000 }
    AccountQualificationChange:
      type: object
      required: [status, reason]
      properties:
        status: { type: string, enum: [SUSPENDED, REVOKED] }
        reason: { type: string, maxLength: 1000 }
